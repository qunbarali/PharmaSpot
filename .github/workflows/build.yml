# .github/workflows/build.yml
name: Build

# Feature branch builds are deliberately manual to avoid consuming Actions minutes
# on every code commit. The default branch workflow is left untouched.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Regenerate lockfile metadata before clean install
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile matches package manifest
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');for(const [n,v] of Object.entries(p.dependencies||{})){if(l.packages?.['']?.dependencies?.[n]!==v||!l.packages?.['node_modules/'+n])throw new Error('Lockfile is missing or inconsistent for '+n)}for(const [n,v] of Object.entries(p.devDependencies||{})){if(l.packages?.['']?.devDependencies?.[n]!==v||!l.packages?.['node_modules/'+n])throw new Error('Lockfile is missing or inconsistent for '+n)}console.log('package-lock-consistent')"

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test -- --runInBand

      - name: Install Linux packaging dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm dpkg

      - name: Install Linux maker backends
        if: matrix.os == 'ubuntu-latest'
        run: npm install --no-save electron-installer-debian@3.2.0 electron-installer-redhat@3.4.0

      - name: Verify Linux maker prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          which fakeroot
          which rpm
          which dpkg
          npm ls electron-installer-debian electron-installer-redhat
          node -e "require('electron-installer-debian'); require('electron-installer-redhat'); console.log('linux-maker-backends-ok');"

      - name: Build installers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO: false
        run: npm run make
