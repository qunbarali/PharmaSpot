name: Summarize an issue (manual only)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to summarize
        required: true
        type: number

permissions:
  issues: write
  models: read
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Load selected issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json title,body > issue.json
          echo "title<<ISSUE_TITLE_EOF" >> "$GITHUB_OUTPUT"
          jq -r '.title' issue.json >> "$GITHUB_OUTPUT"
          echo "ISSUE_TITLE_EOF" >> "$GITHUB_OUTPUT"
          echo "body<<ISSUE_BODY_EOF" >> "$GITHUB_OUTPUT"
          jq -r '.body // ""' issue.json >> "$GITHUB_OUTPUT"
          echo "ISSUE_BODY_EOF" >> "$GITHUB_OUTPUT"

      - name: Run AI inference
        id: inference
        uses: actions/ai-inference@v1
        with:
          prompt: |
            Summarize the following GitHub issue in one paragraph:
            Title: ${{ steps.issue.outputs.title }}
            Body:
            ${{ steps.issue.outputs.body }}

      - name: Comment with AI summary
        run: gh issue comment "$ISSUE_NUMBER" --body "$RESPONSE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RESPONSE: ${{ steps.inference.outputs.response }}
