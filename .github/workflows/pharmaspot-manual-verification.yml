name: PharmaSpot manual verification

on:
  workflow_dispatch:
    inputs:
      package_windows:
        description: Build the Windows desktop package
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enforce feature branch only
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "feature/ocr-distributor-stock-reconciliation") { throw "Run this workflow only on feature/ocr-distributor-stock-reconciliation." }
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated package lock to this feature branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'chore: regenerate package lock for invoice OCR'
            git push origin HEAD:feature/ocr-distributor-stock-reconciliation
          }
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test -- --runInBand
      - name: Build Windows installers
        if: inputs.package_windows
        run: npm run make
      - name: Upload verification outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmaspot-verification-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            package-lock.json
            out/**
