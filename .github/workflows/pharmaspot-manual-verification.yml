name: PharmaSpot manual verification

on:
  workflow_dispatch:
    inputs:
      package_windows:
        description: Build the Windows desktop package
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - name: Enforce feature branch only
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "feature/ocr-distributor-stock-reconciliation") { throw "Run this workflow only on feature/ocr-distributor-stock-reconciliation." }
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Apply non-breaking dependency security fixes
        shell: pwsh
        run: |
          cmd /c "npm audit fix --package-lock-only --ignore-scripts --no-fund"
          $fixExitCode = $LASTEXITCODE
          if ($fixExitCode -ne 0) {
            Write-Host "Some advisories remain or could not be fixed without breaking changes (exit code $fixExitCode). Continuing with compatible fixes only."
          } else {
            Write-Host "Applied available non-breaking dependency security fixes."
          }
          $global:LASTEXITCODE = 0
      - name: Commit regenerated package lock to this feature branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          if ($LASTEXITCODE -ne 0) { throw "Could not configure git author name." }
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { throw "Could not configure git author email." }
          git add package-lock.json
          if ($LASTEXITCODE -ne 0) { throw "Could not stage package-lock.json." }
          git diff --cached --quiet
          $diffExit = $LASTEXITCODE
          if ($diffExit -eq 1) {
            git commit -m 'chore: regenerate package lock for invoice OCR'
            if ($LASTEXITCODE -ne 0) { throw "Could not commit regenerated package-lock.json." }
            git push origin HEAD:feature/ocr-distributor-stock-reconciliation
            if ($LASTEXITCODE -ne 0) { throw "Could not push regenerated lockfile to the feature branch." }
          } elseif ($diffExit -ne 0) {
            throw "Could not inspect staged package-lock.json changes."
          } else {
            Write-Host "package-lock.json is already up to date."
          }
      - name: Verify OCR dependencies are represented in the lockfile
        shell: pwsh
        run: |
          node -e "const p=require('./package.json');const l=require('./package-lock.json');for(const [group,deps] of [['dependencies',p.dependencies||{}],['devDependencies',p.devDependencies||{}]])for(const [n,v] of Object.entries(deps)){if(l.packages?.['']?.[group]?.[n]!==v||!l.packages?.['node_modules/'+n])throw new Error('package-lock.json missing or inconsistent '+group+' entry: '+n)}console.log('all direct dependencies are locked')"
      - name: Install locked dependencies
        run: npm ci
      - name: Verify installed dependency tree
        run: npm ls --depth=0
      - name: Capture dependency vulnerability report
        shell: pwsh
        run: |
          cmd /c "npm audit --json > npm-audit-report.json 2>&1"
          $auditExitCode = $LASTEXITCODE
          if (-not (Test-Path "npm-audit-report.json") -or (Get-Item "npm-audit-report.json").Length -eq 0) {
            throw "npm audit did not produce a vulnerability report."
          }
          if ($auditExitCode -ne 0) {
            Write-Host "npm audit reported advisories (exit code $auditExitCode); continuing so tests and packaging can run."
          } else {
            Write-Host "npm audit completed without reported advisories."
          }
          $global:LASTEXITCODE = 0
      - name: Run automated tests
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: npm test -- --runInBand
      - name: Build Windows installers
        if: inputs.package_windows
        run: npm run make
      - name: Verify Windows installer artifacts and write checksums
        if: inputs.package_windows
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "out/make" -Recurse -File -ErrorAction SilentlyContinue
          $installers = $files | Where-Object { $_.Name -match 'Setup[.]exe$' -or $_.Extension -eq '.msi' }
          if (-not $installers) { throw "No Windows Setup.exe or MSI installer was produced." }
          $files | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $($_.Path)" | Out-File -FilePath "windows-build-sha256.txt" -Append -Encoding utf8
          }
          Write-Host "Verified Windows installer artifacts:"
          $installers | ForEach-Object { Write-Host $_.FullName }
      - name: Upload Squirrel Windows installer
        if: inputs.package_windows && success()
        uses: actions/upload-artifact@v4
        with:
          name: pharmaspot-windows-setup-${{ github.run_number }}
          if-no-files-found: error
          compression-level: 0
          path: out/make/squirrel.windows/x64/*Setup.exe
      - name: Upload MSI installer
        if: inputs.package_windows && success()
        uses: actions/upload-artifact@v4
        with:
          name: pharmaspot-windows-msi-${{ github.run_number }}
          if-no-files-found: error
          compression-level: 0
          path: out/make/wix/x64/*.msi
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmaspot-verification-reports-${{ github.run_number }}
          if-no-files-found: warn
          compression-level: 0
          path: |
            package-lock.json
            windows-build-sha256.txt
            npm-audit-report.json
