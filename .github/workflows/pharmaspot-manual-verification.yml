name: PharmaSpot manual verification

on:
  workflow_dispatch:
    inputs:
      package_windows:
        description: Build the Windows desktop package
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - name: Enforce feature branch only
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "feature/ocr-distributor-stock-reconciliation") { throw "Run this workflow only on feature/ocr-distributor-stock-reconciliation." }
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated package lock to this feature branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          if ($LASTEXITCODE -ne 0) { throw "Could not configure git author name." }
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { throw "Could not configure git author email." }
          git add package-lock.json
          if ($LASTEXITCODE -ne 0) { throw "Could not stage package-lock.json." }
          git diff --cached --quiet
          $diffExit = $LASTEXITCODE
          if ($diffExit -eq 1) {
            git commit -m 'chore: regenerate package lock for invoice OCR'
            if ($LASTEXITCODE -ne 0) { throw "Could not commit regenerated package-lock.json." }
            git push origin HEAD:feature/ocr-distributor-stock-reconciliation
            if ($LASTEXITCODE -ne 0) { throw "Could not push regenerated lockfile to the feature branch." }
          } elseif ($diffExit -ne 0) {
            throw "Could not inspect staged package-lock.json changes."
          } else {
            Write-Host "package-lock.json is already up to date."
          }
      - name: Verify OCR dependencies are represented in the lockfile
        shell: pwsh
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); for (const n of ['pdf-parse','tesseract.js','@tesseract.js-data/eng','@napi-rs/canvas','pdfjs-dist']) { if (p.dependencies[n] && (l.packages[''].dependencies?.[n] !== p.dependencies[n] || !l.packages['node_modules/'+n])) { throw new Error('package-lock.json is missing a consistent entry for '+n); } }"
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test -- --runInBand
      - name: Build Windows installers
        if: inputs.package_windows
        run: npm run make
      - name: Verify Windows installer artifacts and write checksums
        if: inputs.package_windows
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "out/make" -Recurse -File -ErrorAction SilentlyContinue
          $installers = $files | Where-Object { $_.Name -match 'Setup[.]exe$' -or $_.Extension -eq '.msi' }
          if (-not $installers) { throw "No Windows Setup.exe or MSI installer was produced." }
          $files | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $($_.Path)" | Out-File -FilePath "windows-build-sha256.txt" -Append -Encoding utf8
          }
          Write-Host "Verified Windows installer artifacts:"
          $installers | ForEach-Object { Write-Host $_.FullName }
      - name: Upload verification outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmaspot-verification-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            package-lock.json
            out/**
            windows-build-sha256.txt
